<!DOCTYPE html>
<html>
<head>
    <title></title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        document.addEventListener("DOMContentLoaded", function() {
    document.body.style.opacity = 0;
    document.body.style.transition = "opacity 0.8s ease";
    setTimeout(() => {
        document.body.style.opacity = 1;
    }, 10);
});

document.querySelectorAll("a, button[type='submit']").forEach(el => {
    el.addEventListener("click", function(e) {
        e.preventDefault();
        document.body.style.opacity = 0;
        setTimeout(() => {
            window.location = this.href || this.closest("form").action || window.location.href;
        }, 800);
    });
});
    
    </script>
</head>
<body>
    <div class="container">
        <h1>Registrer deg</h1>
        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Brukernavn" value="{{ username or '' }}" required><br><br>
            <input type="email" name="email" placeholder="Epost" value="{{ email or '' }}" required><br><br>
            <input type="password" name="password" placeholder="Passord" required><br><br>
            <input type="password" name="confirm password" placeholder="Bekreft passord" required><br><br>

            <button type="submit">Registrer</button>
        </form>
        <p>Har du allerede konto? <a href="/login">Logg inn</a></p>
    </div>
</body>
</html>
